openapi: 3.1.0
info:
  title: Transmissão Local - API
  version: 0.2.0
  description: >
    Contrato da plataforma privada de transmissão da ala.
    Todos os endpoints abaixo estão implementados e testados no backend NestJS.
servers:
  - url: https://transmissao.exemplo.org/api
paths:
  /healthz:
    get:
      summary: Liveness/readiness de API+BD (implementado)
      responses:
        '200': { description: API e BD saudáveis }

  /v1/broadcasts/current:
    get:
      summary: Estado público da transmissão atual (implementado)
      responses:
        '200': { description: Estado de transmissão sem dados pessoais }

  /v1/viewer/session:
    get:
      summary: Verifica sessão de convite pelo cookie HttpOnly (implementado)
      responses:
        '200': { description: authorized true ou false }

  /v1/viewer/redeem:
    post:
      summary: Resgata convite privado e define cookie HttpOnly com retry P2034 e rate limit (implementado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '201': { description: Cookie tv_session definido }
        '400': { description: Convite malformado }
        '403': { description: Convite expirado ou inválido }
        '429': { description: Limite de requisições excedido }

  /v1/viewer/logout:
    post:
      summary: Encerra e revoga a sessão do espectador (implementado)
      responses:
        '200': { description: Sessão encerrada e cookie limpo }

  /internal/hls-authorize:
    get:
      summary: Autorização por requisição HLS fail-closed (implementado - uso interno pelo Caddy)
      responses:
        '204': { description: Acesso permitido }
        '403': { description: Acesso negado (fail-closed) }

  /v1/operator/login:
    post:
      summary: Login operador com Argon2id e MFA opcional (implementado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Sessão criada via cookie op_session ou mfaRequired true }
        '401': { description: Credenciais inválidas }

  /v1/operator/mfa/verify:
    post:
      summary: Verificação de código TOTP do operador (implementado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string }
      responses:
        '200': { description: Código validado e sessão op_session gerada }
        '401': { description: Código inválido }

  /v1/operator/logout:
    post:
      summary: Logout do operador e revogação da sessão (implementado)
      responses:
        '200': { description: Sessão revogada e cookie op_session limpo }

  /v1/operator/me:
    get:
      summary: Retorna dados do operador autenticado (implementado)
      responses:
        '200': { description: Dados do usuário e perfis de unidade }
        '401': { description: Não autenticado }

  /v1/operator/broadcasts:
    get:
      summary: Lista transmissões da unidade do operador (implementado)
      responses:
        '200': { description: Lista de transmissões }
    post:
      summary: Criação de transmissão (implementado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, scheduledAt]
              properties:
                title: { type: string }
                scheduledAt: { type: string, format: date-time }
                streamPath: { type: string }
      responses:
        '201': { description: Transmissão agendada }

  /v1/operator/broadcasts/{id}:
    get:
      summary: Detalhes da transmissão e estatísticas (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Detalhes da transmissão }

  /v1/operator/broadcasts/{id}/start:
    post:
      summary: Inicia a transmissão mudando estado para LIVE (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Estado LIVE }
        '409': { description: Conflito com outra transmissão ativa }

  /v1/operator/broadcasts/{id}/pause:
    post:
      summary: Pausa a transmissão mudando para PAUSED antes do sacramento (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Estado PAUSED }

  /v1/operator/broadcasts/{id}/resume:
    post:
      summary: Retoma a transmissão para LIVE após a ordenança (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Estado LIVE }

  /v1/operator/broadcasts/{id}/end:
    post:
      summary: Encerra definitivamente a transmissão e revoga sessões de visualização (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Estado ENDED }

  /v1/operator/broadcasts/{id}/invites:
    get:
      summary: Lista convites da transmissão sem expor tokens/hashes (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Lista de convites }
    post:
      summary: Emite novo convite de uso restrito (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxUses: { type: integer, default: 2 }
                expiresInHours: { type: integer, default: 4 }
      responses:
        '201': { description: Token retornado apenas nesta resposta }

  /v1/operator/invites/{id}:
    delete:
      summary: Revoga convite e todas as sessões ativas vinculadas (implementado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Convite e sessões revogadas }

  /v1/operator/stream-health:
    get:
      summary: Consulta saúde do SRT e HLS via API interna do MediaMTX (implementado)
      responses:
        '200': { description: Status do encoder SRT e HLS }

  /v1/operator/mfa/setup:
    post:
      summary: Inicializa configuração do MFA gerando chave Base32 e otpauth URI (implementado)
      responses:
        '200': { description: Chave Base32 e URI retornadas }

  /v1/operator/mfa/enable:
    post:
      summary: Valida primeiro código TOTP e ativa o MFA permanentemente para o operador (implementado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string }
                code: { type: string }
      responses:
        '200': { description: MFA ativado com sucesso }
        '400': { description: Código TOTP inválido }

  /v1/operator/mfa/disable:
    post:
      summary: Desativa o MFA mediante confirmação com senha atual (implementado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200': { description: MFA desativado }
        '401': { description: Senha incorreta }

  /v1/operator/purge-expired:
    post:
      summary: Expurgar sessões e convites antigos com mais de N dias para conformidade LGPD (implementado - ADMIN)
      parameters: [{ name: days, in: query, schema: { type: integer, default: 7 } }]
      responses:
        '200': { description: Contagem de registros expurgados }

  /v1/operator/audit:
    get:
      summary: Trilha de auditoria das ações administrativas da unidade (implementado)
      responses:
        '200': { description: Lista de eventos de auditoria }
