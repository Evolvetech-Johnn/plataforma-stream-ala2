name: transmissao-ala
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN obrigatorio}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL obrigatorio}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - mediamtx
    networks: [private]

  web:
    build: ./apps/web
    restart: unless-stopped
    expose: ["3000"]
    networks: [private]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public
    depends_on:
      db:
        condition: service_healthy
    expose: ["3001"]
    networks: [private]

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    ports:
      - "8890:8890/udp"
    environment:
      MTX_PATHS_ALA01_SRTPUBLISHPASSPHRASE: ${SRT_PUBLISH_PASSPHRASE:?}
      MTX_PATHS_ALA01_SRTREADPASSPHRASE: ${SRT_READ_PASSPHRASE:?}
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks: [private]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [private]

volumes:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  private:
    driver: bridge
